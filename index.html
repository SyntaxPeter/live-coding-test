<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: sans-serif; }
        /* Top Navigation Bar */
        .top-nav { background-color: #000; color: #fff; font-size: 0.8rem; padding: 5px 0; }
        
        /* Main Yellow Navigation Bar */
        .yellow-nav { background-color: #ffcc00; padding: 15px 0; }
        .logo-box { border: 2px solid #000; padding: 5px 15px; font-weight: bold; border-radius: 20px; }
        
        /* Hero Section Styling */
        .hero-section {
            background: linear-gradient(to right, rgba(0,0,0,0.9) 30%, rgba(0,0,0,0) 100%), 
                        url('image_2380a7.jpg') no-repeat center center;
            background-size: cover;
            height: 500px;
            display: flex;
            align-items: center;
            color: white;
        }
        
        /* Text alignment */
        .hero-content { margin-left: 10%; }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <div class="top-nav">
        <div class="container text-uppercase">
            • PERSONAL &nbsp;&nbsp; BUSINESS &nbsp;&nbsp; PLAY &nbsp;&nbsp; INVESTORS &nbsp;&nbsp; FOUNDATION
        </div>
    </div>

    <!-- Yellow Navigation Bar -->
    <nav class="yellow-nav">
        <div class="container d-flex align-items-center">
            <div class="logo-box me-5">MTN</div>
            <div class="d-flex gap-4">
                <span>Data</span> <span>Voice</span> <span>Roaming</span> <span>Devices</span> 
                <span>SIM Services</span> <span>Support</span> <span>Shop →</span>
            </div>
            <div class="ms-auto">🔍</div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="container">
            <div class="hero-content">
                <h1 class="display-3 fw-bold">MTN BetaGist</h1>
                <p class="fs-4">Talk for 6 mins | Get 3 mins extra</p>
                <img src="images\imageye___-_imgi_16_Yello-Days-of-Christmas-Website-copy.png" alt="">
            </div>
        </div>
    </section>

    <!-- Footer Description -->
    <div class="container mt-4 text-center">
        <p>MTN BetaGist is a prepaid plan that lets you call anyone on any network in Nigeria at a flat rate of <b>30 kobo per second</b>.</p>
    </div>

</body>
</html>
